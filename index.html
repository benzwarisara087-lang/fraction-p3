<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>นักคณิตตัวน้อย บวก–ลบเศษส่วน ป.3</title>
<style>
:root{
  --ink:#30404d; --pink:#ff6fae; --pink2:#ffe1ef; --blue:#58c8f4; --blue2:#e6f8ff;
  --yellow:#ffd65a; --green:#6fd29c; --purple:#9c8df5; --red:#ff6d6d;
  --card:#fff; --line:#dceaf2; --shadow:0 12px 28px rgba(70,90,125,.14);
}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Noto Sans Thai",sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff7fb,#eefaff);min-height:100vh}
button,input{font-family:inherit}
.wrap{max-width:1180px;margin:auto;padding:16px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#fff,#fff8fc);border:3px solid #fff;border-radius:28px;box-shadow:var(--shadow);padding:20px;text-align:center}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;opacity:.2}
.hero:before{width:210px;height:210px;background:var(--yellow);right:-75px;top:-85px}
.hero:after{width:170px;height:170px;background:var(--blue);left:-60px;bottom:-85px}
h1{position:relative;margin:0;font-size:clamp(29px,5vw,54px);line-height:1.15;color:#f4579b}
.subtitle{position:relative;margin-top:8px;font-size:clamp(18px,2.4vw,27px);font-weight:800}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:15px}
button{min-height:50px;border:0;border-radius:15px;padding:10px 18px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.09);transition:.15s}
button:hover{filter:brightness(1.02)} button:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.09)} button:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-op{background:#fff;border:3px solid #dceaf2;color:#40515e}.btn-op.active{background:linear-gradient(135deg,#5cc9f2,#8adfff);border-color:#fff;color:#fff}
.btn-sound{background:#fff2bc}.btn-answer{background:linear-gradient(135deg,#ff7fb8,#f4569c);color:#fff;font-size:24px;padding:12px 28px}.btn-reset{background:#e9f8ef;color:#218457}
.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px;margin-top:18px}
.panel{background:var(--card);border:2px solid #fff;border-radius:25px;box-shadow:var(--shadow);padding:18px}
.panel h2{margin:0 0 12px;font-size:clamp(22px,3vw,31px);color:#5966c6}
.fraction-card{border:2px dashed #cfe4ef;background:linear-gradient(180deg,#fff,#fbfdff);border-radius:20px;padding:16px}
.inputs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.frac-input{display:grid;grid-template-rows:auto 5px auto;gap:7px;max-width:170px;margin:auto}
.frac-input input{width:100%;min-height:54px;text-align:center;border:3px solid #bdddeb;border-radius:14px;background:#fbfeff;font-size:25px;font-weight:900;color:#33444e}
.bar{height:5px;border-radius:10px;background:#40515e}.symbol{font-size:46px;font-weight:900;color:#ff6672}
.food-choose{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}.food-choose button{background:#fff;border:3px solid #ececec}.food-choose button.active{background:#fff3f8;border-color:#ffacd0}
.food-stage{display:grid;grid-template-columns:1fr 1fr;gap:14px}.food-box{text-align:center;background:#fbfdff;border-radius:20px;padding:10px;border:1px solid #edf4f7}.food-label{font-size:20px;font-weight:900;margin:3px 0 8px}.food{width:min(100%,340px);aspect-ratio:1/1}
.action-panel{margin-top:18px;text-align:center;background:linear-gradient(135deg,#fff,#fff8fc);border:3px solid #ffd5e7}
.result-wrap{display:grid;grid-template-columns:.72fr 1.28fr;gap:16px;margin-top:16px;align-items:stretch}
.final-card{background:linear-gradient(135deg,#fff8d9,#fff);border:3px solid #ffe28c;border-radius:22px;padding:16px;min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.final-label{font-size:23px;font-weight:900;color:#b47713}.final-result{min-height:110px;display:flex;align-items:center;justify-content:center;width:100%}
.result-frac{display:inline-grid;grid-template-rows:auto 5px auto;gap:7px;min-width:105px;font-size:clamp(42px,7vw,72px);font-weight:900;color:#37474f}.result-frac .line{height:5px;background:#37474f;border-radius:10px}
.placeholder{font-size:19px;color:#6d818d;font-weight:800;line-height:1.5}.error{font-size:20px;color:#cf4141;font-weight:900;line-height:1.5}
.steps-card{background:#fff;border:3px solid #d9ecf7;border-radius:22px;padding:16px;text-align:left;min-height:210px}.steps-title{font-size:24px;color:#407cb1;font-weight:900;margin-bottom:10px;text-align:center}
.steps{display:grid;gap:10px}.step{display:grid;grid-template-columns:48px 1fr;gap:11px;align-items:start;border-radius:17px;padding:11px 12px;background:#f7fbff;border:2px solid #e1eff7;animation:fadeIn .35s ease both}.step:nth-child(2){animation-delay:.08s}.step:nth-child(3){animation-delay:.16s}.step:nth-child(4){animation-delay:.24s}.step:nth-child(5){animation-delay:.32s}
.step-no{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#66cbf3,#9de5ff);color:#fff;font-size:22px;font-weight:900;box-shadow:0 4px 0 rgba(50,130,170,.13)}
.step-text{font-size:20px;line-height:1.5;font-weight:700}.math-line{margin-top:5px;background:#fff;border-radius:11px;padding:8px 10px;text-align:center;font-size:22px;font-weight:900;color:#37474f;border:1px solid #e6eef2;overflow-wrap:anywhere}
.small-note{font-size:17px;color:#657b86;font-weight:700;margin-top:4px}.good{color:#26865a}.warn{color:#bd6d1a}
.spark{position:fixed;pointer-events:none;font-size:27px;z-index:9999;animation:pop 1150ms ease-out forwards}@keyframes pop{0%{transform:translateY(0) scale(.5) rotate(0);opacity:1}100%{transform:translateY(-190px) scale(1.4) rotate(260deg);opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.bounce{animation:bounce .5s ease}@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@media(max-width:850px){.grid,.result-wrap{grid-template-columns:1fr}.food-stage{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.wrap{padding:10px}.panel{padding:13px}.food-stage{grid-template-columns:1fr}.symbol{font-size:36px}.step-text{font-size:18px}.math-line{font-size:19px}.inputs{gap:7px}.frac-input input{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>🍕🎂 นักคณิตตัวน้อย พิชิตเศษส่วน 🎂🍕</h1>
    <div class="subtitle">เลือกบวกหรือลบ ใส่เศษส่วน แล้วเรียนรู้วิธีคิดทีละขั้น</div>
    <div class="toolbar">
      <button id="addBtn" class="btn-op active">➕ การบวก</button>
      <button id="subBtn" class="btn-op">➖ การลบ</button>
      <button id="soundBtn" class="btn-sound">🔊 เสียง: เปิด</button>
    </div>
  </section>

  <section class="grid">
    <div class="panel">
      <h2>1) ใส่โจทย์เศษส่วน</h2>
      <div class="fraction-card">
        <div class="inputs">
          <div class="frac-input">
            <input id="n1" type="number" min="0" value="1" inputmode="numeric" aria-label="ตัวเศษจำนวนที่หนึ่ง">
            <div class="bar"></div>
            <input id="d1" type="number" min="1" value="4" inputmode="numeric" aria-label="ตัวส่วนจำนวนที่หนึ่ง">
          </div>
          <div id="opSymbol" class="symbol">+</div>
          <div class="frac-input">
            <input id="n2" type="number" min="0" value="2" inputmode="numeric" aria-label="ตัวเศษจำนวนที่สอง">
            <div class="bar"></div>
            <input id="d2" type="number" min="1" value="4" inputmode="numeric" aria-label="ตัวส่วนจำนวนที่สอง">
          </div>
        </div>
        <div class="food-choose">
          <button id="pizzaBtn" class="active">🍕 พิซซ่า</button>
          <button id="cakeBtn">🎂 เค้ก</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>2) ดูภาพแทนเศษส่วน</h2>
      <div class="food-stage">
        <div class="food-box"><div class="food-label">เศษส่วนที่ 1</div><canvas id="food1" class="food" width="420" height="420"></canvas></div>
        <div class="food-box"><div class="food-label">เศษส่วนที่ 2</div><canvas id="food2" class="food" width="420" height="420"></canvas></div>
      </div>
    </div>
  </section>

  <section class="panel action-panel">
    <h2>3) ดูคำตอบและวิธีคิด</h2>
    <div class="toolbar">
      <button id="answerBtn" class="btn-answer">✨ เฉลยทีละขั้น ✨</button>
      <button id="resetBtn" class="btn-reset">🔄 เริ่มใหม่</button>
    </div>
    <div class="result-wrap">
      <div class="final-card">
        <div class="final-label">🏆 คำตอบสุดท้าย</div>
        <div id="finalResult" class="final-result"><div class="placeholder">กด “เฉลยทีละขั้น”<br>เพื่อดูคำตอบ</div></div>
      </div>
      <div class="steps-card">
        <div class="steps-title">📚 วิธีคิดอย่างละเอียด</div>
        <div id="steps" class="steps"><div class="placeholder" style="text-align:center;padding:25px 8px">ระบบจะอธิบายตั้งแต่ตรวจตัวส่วน<br>จนถึงการย่อเศษส่วน</div></div>
      </div>
    </div>
  </section>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const state={op:'+',food:'pizza',sound:true,locked:false};
const e={n1:$('n1'),d1:$('d1'),n2:$('n2'),d2:$('d2'),op:$('opSymbol'),add:$('addBtn'),sub:$('subBtn'),pizza:$('pizzaBtn'),cake:$('cakeBtn'),answer:$('answerBtn'),reset:$('resetBtn'),sound:$('soundBtn'),final:$('finalResult'),steps:$('steps'),c1:$('food1'),c2:$('food2')};
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
function simp(n,d){if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g,g}}
function read(nEl,dEl){const n=Number(nEl.value),d=Number(dEl.value);if(!Number.isInteger(n)||!Number.isInteger(d)||n<0||d<=0)return null;if(d>24)return{error:'เพื่อให้ภาพอ่านง่าย กรุณาใช้ตัวส่วนไม่เกิน 24'};return{n,d}}
function lock(v){state.locked=v;[e.n1,e.d1,e.n2,e.d2,e.add,e.sub,e.pizza,e.cake,e.answer,e.reset].forEach(x=>x.disabled=v)}
function sound(kind='win'){if(!state.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC(),now=ctx.currentTime,notes=kind==='win'?[523,659,784,1047]:[220,175];notes.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=kind==='win'?'triangle':'sawtooth';o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.1);g.gain.exponentialRampToValueAtTime(.17,now+i*.1+.02);g.gain.exponentialRampToValueAtTime(.0001,now+i*.1+.17);o.connect(g).connect(ctx.destination);o.start(now+i*.1);o.stop(now+i*.1+.2)});setTimeout(()=>ctx.close(),900)}catch(_){}}
function celebrate(){const icons=['⭐','✨','🎉','💖','🍕','🎂','🌈'];for(let i=0;i<24;i++){const s=document.createElement('span');s.className='spark';s.textContent=icons[Math.floor(Math.random()*icons.length)];s.style.left=(8+Math.random()*84)+'vw';s.style.top=(62+Math.random()*22)+'vh';s.style.animationDelay=(Math.random()*.18)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),1450)}}
function drawFood(canvas,n,d,kind){const ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,r=150,sel=Math.max(0,Math.min(n,d));ctx.clearRect(0,0,W,H);ctx.save();ctx.globalAlpha=.13;ctx.fillStyle='#718096';ctx.beginPath();ctx.ellipse(cx,cy+17,r+35,r+23,0,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,r+27,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#dfedf5';ctx.lineWidth=8;ctx.stroke();const st=-Math.PI/2;for(let i=0;i<d;i++){const a1=st+i*2*Math.PI/d,a2=st+(i+1)*2*Math.PI/d;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a1,a2);ctx.closePath();ctx.fillStyle=kind==='pizza'?(i<sel?'#ffd05b':'#fff1c9'):(i<sel?'#ff9fc8':'#ffe0ee');ctx.fill();ctx.strokeStyle=kind==='pizza'?'#d98a2b':'#d875a1';ctx.lineWidth=4;ctx.stroke()}if(kind==='pizza'){ctx.strokeStyle='#c9792d';ctx.lineWidth=20;ctx.beginPath();ctx.arc(cx,cy,r-4,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#f5b04b';ctx.lineWidth=11;ctx.beginPath();ctx.arc(cx,cy,r-4,0,Math.PI*2);ctx.stroke();const pts=[[-58,-62],[36,-72],[70,-20],[-78,18],[-22,62],[55,61],[5,-16],[-50,52],[78,36]];pts.forEach(p=>{const ang=Math.atan2(p[1],p[0]),norm=(ang-st+Math.PI*2)%(Math.PI*2),seg=Math.floor(norm/(2*Math.PI/d));if(seg<sel){ctx.fillStyle='#e94b4b';ctx.beginPath();ctx.arc(cx+p[0],cy+p[1],12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff0a6';ctx.beginPath();ctx.arc(cx+p[0]-3,cy+p[1]-3,3,0,Math.PI*2);ctx.fill()}})}else{ctx.strokeStyle='#f47fb0';ctx.lineWidth=14;ctx.beginPath();ctx.arc(cx,cy,r-5,0,Math.PI*2);ctx.stroke();const spr=[[-70,-35],[-25,-85],[38,-70],[78,-25],[62,45],[12,78],[-48,64],[-82,15],[0,-25],[30,25],[-35,25]],cols=['#ffcc4d','#61c9ff','#8cd790','#a88bff','#ff6b6b'];spr.forEach((p,i)=>{const ang=Math.atan2(p[1],p[0]),norm=(ang-st+Math.PI*2)%(Math.PI*2),seg=Math.floor(norm/(2*Math.PI/d));if(seg<sel){ctx.save();ctx.translate(cx+p[0],cy+p[1]);ctx.rotate((i%4)*.5);ctx.fillStyle=cols[i%cols.length];ctx.fillRect(-4,-10,8,20);ctx.restore()}});if(sel>0){ctx.fillStyle='#e9445b';ctx.beginPath();ctx.arc(cx,cy-105,16,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#388e3c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(cx+2,cy-120);ctx.quadraticCurveTo(cx+18,cy-145,cx+30,cy-138);ctx.stroke()}}ctx.fillStyle='#fff';ctx.strokeStyle='#cfe5f3';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(cx-55,H-72,110,52,18);ctx.fill();ctx.stroke();ctx.fillStyle='#37474f';ctx.font='bold 28px Tahoma';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n+'/'+d,cx,H-46)}
function clearAnswer(){e.final.innerHTML='<div class="placeholder">กด “เฉลยทีละขั้น”<br>เพื่อดูคำตอบ</div>';e.steps.innerHTML='<div class="placeholder" style="text-align:center;padding:25px 8px">ระบบจะอธิบายตั้งแต่ตรวจตัวส่วน<br>จนถึงการย่อเศษส่วน</div>'}
function update(){const a=read(e.n1,e.d1),b=read(e.n2,e.d2);drawFood(e.c1,a&&!a.error?a.n:0,a&&!a.error?a.d:4,state.food);drawFood(e.c2,b&&!b.error?b.n:0,b&&!b.error?b.d:4,state.food);clearAnswer()}
function setOp(op){if(state.locked)return;state.op=op;e.op.textContent=op;e.add.classList.toggle('active',op==='+');e.sub.classList.toggle('active',op==='-');clearAnswer()}
function setFood(k){if(state.locked)return;state.food=k;e.pizza.classList.toggle('active',k==='pizza');e.cake.classList.toggle('active',k==='cake');update()}
function error(msg){e.final.innerHTML='<div class="error">⚠️ '+msg+'</div>';e.steps.innerHTML='<div class="error" style="text-align:center;padding:20px">ตรวจตัวเลขในโจทย์แล้วลองอีกครั้ง</div>';sound('bad')}
function fracHTML(n,d){return `<div class="result-frac"><div>${n}</div><div class="line"></div><div>${d}</div></div>`}
function step(no,title,math,note=''){return `<div class="step"><div class="step-no">${no}</div><div class="step-text">${title}${math?`<div class="math-line">${math}</div>`:''}${note?`<div class="small-note">${note}</div>`:''}</div></div>`}
function solve(){if(state.locked)return;const a=read(e.n1,e.d1),b=read(e.n2,e.d2);if(!a||!b)return error('ตัวเศษต้องเป็นจำนวนเต็มตั้งแต่ 0 ขึ้นไป และตัวส่วนต้องตั้งแต่ 1 ขึ้นไป');if(a.error)return error(a.error);if(b.error)return error(b.error);let num,den,html='';const sign=state.op;
html+=step(1,'อ่านโจทย์และดูเครื่องหมาย',`${a.n}/${a.d} ${sign} ${b.n}/${b.d}`,'วันนี้เราจะคำนวณเศษส่วนทั้งสองจำนวนนี้');
if(a.d===b.d){
  html+=step(2,'ตัวส่วนเท่ากันแล้ว จึงคงตัวส่วนเดิมไว้',`ตัวส่วน = ${a.d}`,'เมื่อส่วนเท่ากัน เราจัดการที่ตัวเศษได้เลย');
  num=sign==='+'?a.n+b.n:a.n-b.n;den=a.d;
  html+=step(3,sign==='+'?'บวกตัวเศษเข้าด้วยกัน':'ลบตัวเศษออกจากกัน',`${a.n} ${sign} ${b.n} = ${num}`,'ตัวส่วนยังคงเป็น '+den);
  html+=step(4,'เขียนผลลัพธ์ก่อนย่อ',`${num}/${den}`,'จากนั้นตรวจว่าย่อเศษส่วนได้หรือไม่');
}else{
  const common=a.d*b.d,an=a.n*b.d,bn=b.n*a.d;
  html+=step(2,'ตัวส่วนยังไม่เท่ากัน จึงทำตัวส่วนให้เท่ากัน',`${a.d} × ${b.d} = ${common}`,'ใช้ตัวส่วนร่วมที่ได้จากการคูณตัวส่วนทั้งสอง');
  html+=step(3,'สร้างเศษส่วนที่มีค่าเท่าเดิม แต่มีตัวส่วนเท่ากัน',`${a.n}/${a.d} = ${an}/${common}  และ  ${b.n}/${b.d} = ${bn}/${common}`,'คูณทั้งตัวเศษและตัวส่วนด้วยจำนวนเดียวกัน');
  num=sign==='+'?an+bn:an-bn;den=common;
  html+=step(4,sign==='+'?'บวกตัวเศษ เมื่อส่วนเท่ากันแล้ว':'ลบตัวเศษ เมื่อส่วนเท่ากันแล้ว',`${an} ${sign} ${bn} = ${num}  ดังนั้นได้  ${num}/${den}`,'ตัวส่วนคงเป็น '+den);
}
const s=simp(num,den);if(s.g>1){html+=step(a.d===b.d?5:5,'ย่อเศษส่วนให้เป็นอย่างต่ำ',`${num} ÷ ${s.g} = ${s.n}  และ  ${den} ÷ ${s.g} = ${s.d}`,'หารทั้งตัวเศษและตัวส่วนด้วย '+s.g+' ได้คำตอบอย่างต่ำ');}else{html+=step(5,'ตรวจการย่อเศษส่วน',`${num}/${den}`,'เศษส่วนนี้ย่อไม่ได้แล้ว จึงเป็นคำตอบอย่างต่ำ');}
e.steps.innerHTML=html;lock(true);e.final.innerHTML=fracHTML(s.n,s.d);const r=e.final.querySelector('.result-frac');if(r)r.classList.add('bounce');celebrate();sound('win');setTimeout(()=>lock(false),850)}
e.add.addEventListener('click',()=>setOp('+'));e.sub.addEventListener('click',()=>setOp('-'));e.pizza.addEventListener('click',()=>setFood('pizza'));e.cake.addEventListener('click',()=>setFood('cake'));e.answer.addEventListener('click',solve);e.reset.addEventListener('click',()=>{if(state.locked)return;e.n1.value=1;e.d1.value=4;e.n2.value=2;e.d2.value=4;state.op='+';state.food='pizza';e.op.textContent='+';e.add.classList.add('active');e.sub.classList.remove('active');e.pizza.classList.add('active');e.cake.classList.remove('active');update()});e.sound.addEventListener('click',()=>{state.sound=!state.sound;e.sound.textContent=state.sound?'🔊 เสียง: เปิด':'🔇 เสียง: ปิด'});[e.n1,e.d1,e.n2,e.d2].forEach(x=>x.addEventListener('input',()=>{if(!state.locked)update()}));update();
})();
